<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card shadow-lg border-0">

        <!-- Header -->
        <div class="card-header bg-success text-white text-center">
          <h4 class="mb-0">
            <i class="bi bi-droplet-half me-2"></i> Hydro Feedback
          </h4>
        </div>

        <div class="card-body p-4">

          <!-- Success Message -->
          <div *ngIf="issubmitted" class="alert alert-success text-center">
            ✅ Thank you for your valuable feedback!
          </div>

          <form [formGroup]="feedbackForm" (ngSubmit)="onSubmit()">

            <div class="row">

              <!-- LEFT SIDE -->
              <div class="col-md-6">

                <!-- Name -->
                <div class="mb-3">
                  <label class="form-label">
                    <i class="bi bi-person-fill me-1"></i> Name
                  </label>
                  <input formControlName="name" class="form-control" placeholder="Enter your name">
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label class="form-label">
                    <i class="bi bi-envelope-fill me-1"></i> Email
                  </label>
                  <input formControlName="email" class="form-control" placeholder="Enter your email">
                </div>

                <!-- Mobile -->
                <div class="mb-3">
                  <label class="form-label">
                    <i class="bi bi-telephone-fill me-1"></i> Mobile
                  </label>
                  <input formControlName="mobile" class="form-control" placeholder="Enter number">
                </div>

              </div>

              <!-- RIGHT SIDE -->
              <div class="col-md-6">

                <!-- Product Quality -->
                <div class="mb-3">
                  <label class="form-label d-block">
                    <i class="bi bi-star-fill text-warning me-1"></i> Product Quality
                  </label>
                  <span *ngFor="let i of [1,2,3,4,5]"
                        (click)="setRating('productQuality',i)"
                        [class.text-warning]="i <= feedbackForm.value.productQuality"
                        class="fs-4 me-1" style="cursor:pointer;">
                    ★
                  </span>
                </div>

                <!-- Product Price -->
                <div class="mb-3">
                  <label class="form-label d-block">
                    <i class="bi bi-currency-rupee me-1"></i> Product Price
                  </label>
                  <span *ngFor="let i of [1,2,3,4,5]"
                        (click)="setRating('productPrice',i)"
                        [class.text-warning]="i <= feedbackForm.value.productPrice"
                        class="fs-4 me-1" style="cursor:pointer;">
                    ★
                  </span>
                </div>

                <!-- Order Process -->
                <div class="mb-3">
                  <label class="form-label d-block">
                    <i class="bi bi-cart-check-fill me-1"></i> Order Process
                  </label>
                  <span *ngFor="let i of [1,2,3,4,5]"
                        (click)="setRating('orderProcess', i)"
                        [class.text-warning]="i <= feedbackForm.value.orderProcess"
                        class="fs-4 me-1" style="cursor:pointer;">
                    ★
                  </span>
                </div>

                <!-- Delivery -->
                <div class="mb-3">
                  <label class="form-label d-block">
                    <i class="bi bi-truck me-1"></i> Delivery Service
                  </label>
                  <span *ngFor="let i of [1,2,3,4,5]"
                        (click)="setRating('deliveryService', i)"
                        [class.text-warning]="i <= feedbackForm.value.deliveryService"
                        class="fs-4 me-1" style="cursor:pointer;">
                    ★
                  </span>
                </div>

              </div>

            </div>

            <!-- Suggestion -->
            <div class="mb-3">
              <label class="form-label">
                <i class="bi bi-chat-left-text-fill me-1"></i> Suggestions
              </label>
              <textarea formControlName="suggestion" rows="2" class="form-control" placeholder="Write your thoughts..."></textarea>
            </div>

            <!-- Button -->
            <button type="submit" class="btn btn-success w-100" [disabled]="issubmitting">
              <i class="bi bi-send-fill me-1"></i> Submit Feedback
            </button>

          </form>

        </div>

      </div>

    </div>
  </div>
</div>
