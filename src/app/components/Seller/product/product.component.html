<div class="container my-4">

  <!-- 🔹 Title -->
  <div class="text-center mb-4">
    <h2 class="fw-bold text-success">Manage Products</h2>
    <p class="text-muted">Add and manage your hydroponic products</p>
  </div>

  <!-- 🔹 Form Card -->
  <div class="card shadow-lg border-0 form-card p-4">

    <h4 class="mb-3 text-success">
      {{isEdit ? 'Edit Product' : 'Add Product'}}
    </h4>

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Product Name</label>
        <input class="form-control" [(ngModel)]="newProduct.name">
      </div>

      <div class="col-md-3">
        <label class="form-label">Price</label>
        <input type="number" class="form-control" [(ngModel)]="newProduct.price">
      </div>

      <div class="col-md-3">
        <label class="form-label">Unit</label>
        <input type="text" class="form-control" [(ngModel)]="newProduct.unit" placeholder="e.g kg">
      </div>

      <div class="col-md-3">
        <label class="form-label">Stock</label>
        <input type="number" class="form-control" [(ngModel)]="newProduct.stock">
      </div>

      <div class="col-md-6">
        <label class="form-label">Category</label>
        <select class="form-select" [(ngModel)]="newProduct.categoryId">
          <option [value]="0">Select category</option>
          <option *ngFor="let c of categories" [value]="c.id">{{c.catname}}</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Upload Images</label>
        <input type="file" class="form-control" multiple (change)="onImageSelected($event)">
      </div>

      <!-- 🔹 Image Preview -->
      <div class="col-12 d-flex gap-2 flex-wrap" *ngIf="imagePreview?.length">
        <img *ngFor="let img of imagePreview" [src]="img" class="preview-img">
      </div>

      <!-- 🔹 Specifications -->
      <div class="col-12 mt-3">
        <h5 class="text-success">Specifications</h5>

        <div *ngFor="let spec of newProduct.specifications; let i=index" class="row g-2 mb-2">
          <div class="col-md-5">
            <input class="form-control" placeholder="Name" [(ngModel)]="spec.name" name="specName{{i}}">
          </div>
          <div class="col-md-5">
            <input class="form-control" placeholder="Value" [(ngModel)]="spec.value" name="specValue{{i}}">
          </div>
          <div class="col-md-2">
            <button type="button" class="btn btn-danger w-100" (click)="removeSpecification(i)">Remove</button>
          </div>
        </div>

        <button type="button" class="btn btn-outline-success btn-sm" (click)="addSpecification()">
          + Add Specification
        </button>
      </div>

      <!-- 🔹 Buttons -->
      <div class="col-12 mt-3">
        <button class="btn btn-gradient me-2" *ngIf="!isEdit" (click)="addProduct()">Add Product</button>
        <button class="btn btn-success me-2" *ngIf="isEdit" (click)="updateProduct()">Update</button>
        <button class="btn btn-secondary" (click)="resetForm()">Clear</button>
      </div>

    </div>
  </div>

  <!-- 🔹 Table -->
  <div class="card shadow-lg border-0 mt-5 p-3">

    <h5 class="text-success mb-3">Product List</h5>

    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Image</th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Unit</th>
          <th>Stock</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let p of products" class="table-row">
          <td>{{p.id}}</td>

          <td>
            <img *ngIf="p.images?.length" [src]="p.images[0].imageUrl" class="table-img">
          </td>

          <td>{{p.name}}</td>
          <td>{{p.category?.catname}}</td>
          <td>₹{{p.price}}</td>
          <td>/{{p.unit}}</td>
          <td>{{p.stock}}</td>

          <td>
            <button class="btn btn-sm btn-warning me-1" (click)="editProduct(p)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteProduct(p.id!)">Delete</button>
            <!-- <button class="btn btn-sm btn-danger" (click)="deleteProduct(p.id)">Delete</button> -->
          </td>
        </tr>
      </tbody>
    </table>

  </div>

</div>
