<div class="card mx-auto mt-5" style="max-width: 400px;">
  <div class="card-body">
    <h3 class="card-title text-center mb-4">Login</h3>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" [(ngModel)]="loginRequest.email" class="form-control" />
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" [(ngModel)]="loginRequest.password" class="form-control" />
    </div>

    <button (click)="login()" class="btn btn-primary w-100">Login</button>
     <p class="text-center mt-2">
       <a class="text-decoration-none" routerLink="/forgot-password">Forgot Password</a>
    </p>

    <p class="text-center mt-3">
      Don't have an account? <a  (click)="showRegisterOptions()" >Register</a>
      
    </p>
    <div *ngIf="showRegisterOption">
      <p>
        <a class="nav-link" routerLink="/signUp">For Customer</a>
        <a class="nav-link" routerLink="/signUpSeller">For Seller</a>
      </p>
    </div>  
  </div>
</div>
